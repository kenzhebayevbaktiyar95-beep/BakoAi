<!DOCTYPE html><html lang="kk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BakoAi</title><style>body{margin:0;font-family:system-ui;background:#fff}.top{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid #eee;max-width:1000px;margin:auto;position:sticky;top:0;background:#fff;z-index:10}.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:22px;color:#5b21b6}.logo img{width:48px;height:48px;border-radius:12px}.lang{display:flex;gap:6px}.lang button{border:1px solid #ddd;background:#fff;padding:6px 12px;border-radius:999px;font-weight:700}.lang button.active{background:#6e00ff;color:#fff;border-color:#6e00ff}.hero{padding:56px 20px;text-align:center;background:linear-gradient(135deg,#6e00ff,#004dff);color:#fff}.hero h1{font-size:44px;margin:0;display:flex;justify-content:center;align-items:center;gap:14px}.hero h1 img{width:64px;height:64px;background:#fff;border-radius:16px;padding:6px}.chat{max-width:680px;margin:24px auto;padding:16px;padding-bottom:140px}.msg{margin:12px 0;padding:14px 18px;border-radius:20px;display:inline-block;max-width:80%}.ai{background:#f3f4f6}.me{background:#6e00ff;color:#fff;float:right;clear:both}.bako{position:fixed;bottom:90px;right:16px;text-align:center;z-index:999}.bako img{width:78px;height:78px;border-radius:50%;border:3px solid #9333ea;object-fit:cover;box-shadow:0 8px 20px rgba(0,0,0,.3);background:#fff}.online{background:#22c55e;color:#fff;font-size:11px;padding:4px 10px;border-radius:999px;margin-top:6px;display:inline-block;font-weight:700}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;padding:12px}.box{max-width:700px;margin:auto;display:flex;gap:8px}input{flex:1;border:1px solid #ddd;border-radius:999px;padding:14px 18px}button.send{background:#6e00ff;color:#fff;border:0;border-radius:999px;padding:14px 24px;font-weight:800}</style></head><body><div class="top"><div class="logo"><img src="logo.png"> BakoAi</div><div class="lang"><button onclick="setLang('kz')" id="btn-kz" class="active">KZ</button><button onclick="setLang('ru')" id="btn-ru">RU</button><button onclick="setLang('en')" id="btn-en">EN</button></div></div><div class="hero"><h1><img src="logo.png"> BakoAi</h1><p id="hero-desc">Қазақстанға арналған ең ақылды AI ассистент</p><a class="btn" href="#chatbox" id="hero-btn">Чатты бастау</a></div><div class="chat" id="chatbox"><div><div class="msg ai" id="hello-msg">Сәлем! Мен Bako-мын. Қалай көмектесе аламын? 👋</div></div></div><div class="bako"><img src="bako.png"><div class="online">Bako — онлайн</div></div><div class="bottom"><div class="box"><input id="q" placeholder="Сұрақ қой..." onkeydown="if(event.key==='Enter')send()"><button class="send" onclick="send()" id="send-btn">Жіберу</button></div></div><script>const T={kz:{hero:"Қазақстанға арналған ең ақылды AI ассистент",btn:"Чатты бастау",hello:"Сәлем! Мен Bako-мын. Қалай көмектесе аламын? 👋",ph:"Сұрақ қой...",send:"Жіберу",pre:" керемет сұрақ! Мен Bako-мын 🧠"},ru:{hero:"Самый умный AI-ассистент для Казахстана",btn:"Начать чат",hello:"Привет! Я Bako. Чем могу помочь? 👋",ph:"Задай вопрос...",send:"Отправить",pre:" — отличный вопрос! Я Bako 🧠"},en:{hero:"The smartest AI assistant for Kazakhstan",btn:"Start Chat",hello:"Hello! I'm Bako. How can I help? 👋",ph:"Ask something...",send:"Send",pre:" — great question! I'm Bako 🧠"}};let cur='kz';function setLang(l){cur=l;document.getElementById('hero-desc').innerText=T[l].hero;document.getElementById('hero-btn').innerText=T[l].btn;document.getElementById('hello-msg').innerText=T[l].hello;document.getElementById('q').placeholder=T[l].ph;document.getElementById('send-btn').innerText=T[l].send;document.querySelectorAll('.lang button').forEach(b=>b.classList.remove('active'));document.getElementById('btn-'+l).classList.add('active')}function send(){let i=document.getElementById('q');let v=i.value.trim();if(!v)return;let c=document.getElementById('chatbox');c.innerHTML+=`<div style='text-align:right'><div class='msg me'>${v}</div></div>`;i.value='';setTimeout(()=>{c.innerHTML+=`<div><div class='msg ai'>"${v}"${T[cur].pre}</div></div>`;window.scrollTo(0,document.body.scrollHeight)},500)}</script></body></html>
